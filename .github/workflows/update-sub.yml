name: Update Telegram Config Subscription

on:
  schedule:
    # هر ۳۰ دقیقه یک‌بار اجرا میشه (زمان UTC)
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # امکان اجرای دستی از تب Actions

permissions:
  contents: write

jobs:
  update-sub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        env:
          TELEGRAM_CHANNEL: "Gp_config"
          MAX_CONFIGS: "20"
        run: python main.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sub/
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update subscription [skip ci]"
          git push
